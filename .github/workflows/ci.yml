name: Build and tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Core NTFS and cleanup tests
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP ('diskscope-tests-' + [guid]::NewGuid())
          dotnet run --project tests/DiskScope.Tests.csproj -c Release -- $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed' }
      - name: Build portable package
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_TYPE: ${{ github.ref_type }}
        run: |
          $version = if ($env:RELEASE_TYPE -eq 'tag') { $env:RELEASE_REF.TrimStart('v') } else { '1.0.0' }
          ./scripts/package.ps1 -Version $version
      - name: Packaged MCP and CLI smoke tests
        shell: pwsh
        run: |
          $stage = Get-ChildItem -LiteralPath artifacts/staging -Directory | Select-Object -First 1
          python tests/mcp_smoke.py (Join-Path $stage.FullName 'DiskScope.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Protocol smoke tests failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: |
            artifacts/*.zip
            artifacts/*SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release
          path: release-assets
      - name: Publish tested release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          $notes = Join-Path 'docs/releases' ($env:RELEASE_TAG + '.md')
          $assets = @(Get-ChildItem -LiteralPath release-assets -File | Select-Object -ExpandProperty FullName)
          gh release create $env:RELEASE_TAG @assets --verify-tag --title "DiskScope $env:RELEASE_TAG" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
